# 默认值(dev/本地集群)。生产环境通过 values-prod.yaml 覆盖。

# -- 镜像配置
image:
  repository: multi-agent-edu/python-api
  tag: "2.0.0"
  pullPolicy: IfNotPresent
  # pullSecrets:
  #   - name: registry-credentials

# -- 副本数(HPA 启用后作为下限)
replicaCount: 3

# -- 资源 requests/limits
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# -- 水平自动扩缩容
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# -- Pod 安全上下文(非 root)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- 容器安全上下文
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # FastAPI 需写临时文件
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- 服务
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# -- Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "multi-agent-edu"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.edu.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: multi-agent-edu-tls
      hosts:
        - api.edu.local

# -- 健康检查
probe:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# -- 应用配置(非敏感,ConfigMap)
config:
  env: production
  logLevel: INFO
  # CORS / OAuth 等公开配置
  corsOrigins: "*"
  jwtExpiresMinutes: 30
  rateLimitGlobalPerMin: 100
  rateLimitLoginPerMin: 5

# -- 敏感配置(Secret,生产用 Sealed Secrets 或外部密钥管理)
secrets:
  # 生产部署时必须覆盖
  databaseUrl: "postgresql+asyncpg://postgres:postgres@postgresql:5432/edu_agent"
  redisUrl: "redis://redis-headless:6379/0"
  jwtSecretKey: "CHANGE_ME_IN_PRODUCTION"
  openaiApiKey: ""
  minimaxApiKey: ""
  encryptionKey: "CHANGE_ME_32_BYTES_HEX"

# -- 依赖 chart 配置
postgresql:
  enabled: true
  auth:
    postgresPassword: postgres
    database: edu_agent
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      size: 8Gi

# -- Pod 反亲和(跨节点分布)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: multi-agent-edu
          topologyKey: kubernetes.io/hostname

# -- 节点选择器
nodeSelector: {}

# -- 容忍
tolerations: []

# -- PodDisruptionBudget(滚动更新时至少保留 1 个)
pdb:
  enabled: true
  minAvailable: 1

# -- NetworkPolicy(零信任)
networkPolicy:
  enabled: true
  # 允许的入站命名空间
  ingressFromNamespaces:
    - ingress-nginx
    - monitoring

# -- 迁移 Job(每次发布前跑 alembic upgrade head)
migrator:
  enabled: true
  # 迁移失败则不发布(置为 false 跳过)
  blocking: true

# -- Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- 监控(Prometheus ServiceMonitor)
monitoring:
  enabled: true
  namespace: monitoring
  interval: 30s
