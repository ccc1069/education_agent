apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent-edu.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-agent-edu.labels" . | nindent 4 }}
type: Opaque
# 生产部署: 用 Sealed Secrets / External Secrets / Vault 替代明文
# https://github.com/bitnami-labs/sealed-secrets
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.minimaxApiKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
